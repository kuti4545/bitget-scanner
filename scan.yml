name: Bitget Tarama

on:
  schedule:
    # GitHub en sık 5 dk çalıştırır (3-4 dk mümkün değil). UTC.
    - cron: "3-59/5 * * * *"
  workflow_dispatch:

concurrency:
  group: bitget-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bağımlılıklar
        run: pip install -r requirements.txt

      - name: Tara
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEFRAME: "15m"
          MIN_USDT_VOLUME_24H: "2000000"
          MAX_SYMBOLS: "80"
          ALERT_SCORE: "7.0"
          MAX_ALERTS_PER_RUN: "2"
          ALERT_COOLDOWN_MIN: "180"
          ACCOUNT_EQUITY: "300"
        run: python scanner.py

      - name: Sonuçları kaydet
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add docs/latest.json docs/state.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "scan $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
